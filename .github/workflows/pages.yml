
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-prod

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: develop
          path: site-dev

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build combined website
        run: |
          mkdir -p _site
          mkdir -p _site/preview

          echo "Copying production website..."
          rsync -av --exclude='.git' site-prod/ _site/

          echo "Copying development website..."
          rsync -av --exclude='.git' site-dev/ _site/preview/

          touch _site/.nojekyll

      - name: Verify combined website
        run: |
          echo "Generated website files:"
          find _site -maxdepth 3 -type f | sort

          echo "Checking required files..."

          test -f _site/index.html
          test -f _site/preview/index.html

          echo "Both production and preview index.html files exist."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
