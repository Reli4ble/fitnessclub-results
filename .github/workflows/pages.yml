
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout production
        uses: actions/checkout@v7
        with:
          ref: main
          path: site-prod

      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: develop
          path: site-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production event data
        run: |
          npx --yes ajv-cli@5 validate --spec=draft2020 -s site-prod/schemas/events-catalogue.schema.json -d site-prod/data/events.json --all-errors
          npx --yes ajv-cli@5 validate --spec=draft2020 -s site-prod/schemas/event.schema.json -d 'site-prod/data/events/*.json' --all-errors
          node site-prod/scripts/validate-events.mjs site-prod

      - name: Validate development event data
        run: |
          npx --yes ajv-cli@5 validate --spec=draft2020 -s site-dev/schemas/events-catalogue.schema.json -d site-dev/data/events.json --all-errors
          npx --yes ajv-cli@5 validate --spec=draft2020 -s site-dev/schemas/event.schema.json -d 'site-dev/data/events/*.json' --all-errors
          node site-dev/scripts/validate-events.mjs site-dev

      - name: Generate team share preview pages
        run: |
          node site-prod/scripts/generate-team-share-pages.mjs _site
          node site-dev/scripts/generate-team-share-pages.mjs _site/preview

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build combined website
        run: |
          mkdir -p _site
          mkdir -p _site/preview

          echo "Copying production website..."
          rsync -av --exclude='.git' site-prod/ _site/

          echo "Copying development website..."
          rsync -av --exclude='.git' site-dev/ _site/preview/

          touch _site/.nojekyll

      - name: Verify combined website
        run: |
          echo "Generated website files:"
          find _site -maxdepth 3 -type f | sort

          echo "Checking required files..."

          test -f _site/index.html
          test -f _site/preview/index.html

          echo "Both production and preview index.html files exist."

      - name: Archive Pages website
        run: |
          tar \
            --dereference --hard-dereference \
            --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
